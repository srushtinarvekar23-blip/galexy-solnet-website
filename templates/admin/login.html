<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"></head>
<body><div class="loginwrap"><form class="loginbox" method="post"><h1>Admin Login</h1><p>Galexy Sonnet control panel</p>
{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}
<input name="username" placeholder="Username" required autofocus><input name="password" type="password" placeholder="Password" required><button class="lime btn">Sign in</button>
<p style="margin-top:16px"><a href="/">← Back to website</a></p></form></div></body></html>
