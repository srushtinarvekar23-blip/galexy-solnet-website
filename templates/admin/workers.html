{% extends "admin/base_admin.html" %}{% block body %}<h1>Workers</h1><div class="card formcard"><form method="post"><input name="name" placeholder="Worker name" required><input name="phone" placeholder="Phone"><button>Add worker</button></form></div><br>
<table><tr><th>Name</th><th>Phone</th><th>Status</th><th></th></tr>{% for w in workers %}<tr><td>{{ w.name }}</td><td>{{ w.phone }}</td><td>{{ 'Active' if w.active else 'Inactive' }}</td><td><form method="post" action="{{ url_for('toggle_worker', wid=w.id) }}"><button>Toggle</button></form></td></tr>{% endfor %}</table>{% endblock %}
