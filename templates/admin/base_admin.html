<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Galexy Sonnet</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"></head>
<body><div class="shell"><aside class="side"><div class="logo">GALEXY SOLNET<small>ADMIN PANEL</small></div>
{% set ep = request.endpoint %}
<a class="{{ 'on' if ep=='dashboard' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
<a class="{{ 'on' if ep in ['orders'] }}" href="{{ url_for('orders') }}">Orders</a>
<a class="{{ 'on' if ep=='workers' }}" href="{{ url_for('workers') }}">Workers</a>
<a class="{{ 'on' if ep in ['admin_products','product_form'] }}" href="{{ url_for('admin_products') }}">Products</a>
<a class="{{ 'on' if ep=='enquiries' }}" href="{{ url_for('enquiries') }}">Enquiries</a>
<a class="{{ 'on' if ep=='password' }}" href="{{ url_for('password') }}">Password</a>
<a href="/" target="_blank">View website ↗</a><a href="{{ url_for('logout') }}">Logout ({{ session.admin }})</a></aside>
<section class="content">{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% block body %}{% endblock %}</section></div></body></html>
